##### General behavior #####

# Enable mouse support (pane selection, resizing, scrolling)
set -g mouse on

# Use vi-style keys in copy mode
setw -g mode-keys vi

# Faster key response
set -sg escape-time 10

# Start window numbering at 1 (more natural than 0)
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on


##### Splits #####

# Open splits in the same working directory
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


##### Copy mode #####

# Enter copy mode with v
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel


##### Status bar #####

# Update status bar more frequently
set -g status-interval 5

# Show window list with activity
setw -g monitor-activity on
set -g visual-activity on


##### Reload config #####

# Reload tmux config easily
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

